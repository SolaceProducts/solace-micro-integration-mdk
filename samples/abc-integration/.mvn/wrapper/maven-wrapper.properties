wrapperVersion=3.3.2
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.10/apache-maven-3.9.10-bin.zip
# SHA-256 of the distribution above. mvnw verifies this before unpacking and
# aborts the build on mismatch, so a swapped artifact cannot execute in CI.
#
# Maven Central publishes only a .sha512 for this zip, and mvnw accepts sha256
# only; this value was computed from bytes whose .sha512 was first checked
# against the published one.
#
# Dependabot does NOT update this line. Any PR that changes distributionUrl
# will fail the build until the checksum is recomputed by hand - that is the
# intended behaviour, not a bug. To refresh it:
#
#   U=<new distributionUrl>
#   curl -sfL -o /tmp/mvn.zip "$U"
#   diff <(curl -sf "$U.sha512" | tr -d '[:space:]') <(sha512sum /tmp/mvn.zip | cut -d' ' -f1)
#   sha256sum /tmp/mvn.zip
distributionSha256Sum=b917e5e8c9f86a063e621241392f43619f414e68de93c1a6753cd56594cdac40
