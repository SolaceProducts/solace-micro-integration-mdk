# abc:
#  base-url: <will be injected for testing in AbcSimpleContainerTestExtension using environment variable, it can also be set in test using @DynamicPropertySource>
#  authentication: # defined in AbcBinderConnectionProperties
#   authentication-type: basic
#   username: <will be injected for testing in AbcSimpleContainerTestExtension using environment variable, it can also be set in test using @DynamicPropertySource>
#   password: <will be injected for testing in AbcSimpleContainerTestExtension using environment variable>

spring:
  cloud:
    function:
      definition: "testConsumer"
    stream:
      bindings:
        testConsumer-in-0:
          destination: source-destination
          binder: abc
          group: test-group

      abc: # This section is for binder-specific configuration for the 'abc' binder, defined by AbcExtendedBindingProperties
        default: # Default configuration for all bindings using the 'abc' binder, defined in AbcExtendedBindingProperties
          consumer: # Consumer-specific configuration for all bindings using the 'abc' binder, defined in AbcConsumerProperties
            polling-interval: 1000

management:
  endpoint:
    health:
      show-components: always
      show-details: always
  endpoints:
    web:
      exposure:
        include: 'health'
  health:
    binders:
      enabled: true

# Logging configuration for tests
logging:
  level:
    root: INFO
    com.solace.samples.binder.abc: DEBUG
